[project]
name = "aetherscale"
version = "0.9.2"
description = "GPU-native NVIDIA enhancement with in-process DLSS Neural Rendering, native DLSS Frame Generation, and high-throughput NVENC/ProRes video output nodes for ComfyUI."
authors = [{ name = "noise" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/vizart-vj/ComfyUI-AetherScale"
Documentation = "https://github.com/vizart-vj/ComfyUI-AetherScale#readme"
"Bug Tracker" = "https://github.com/vizart-vj/ComfyUI-AetherScale/issues"

[tool.comfy]
PublisherId = "noise"
DisplayName = "AetherScale"
Icon = ""
